# Continuous integration: markdown quality for the guide and kit, and a structural
# validation of the 37-locale video sources. The heavy media build is local-only
# (macOS `say` + ffmpeg), so CI verifies the text layer that reproduces anywhere.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: CI only reads the repository.
permissions:
  contents: read

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Markdown lint and source validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Markdown lint
        run: npm run markdownlint

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate the video sources
        run: python3 content/youtube/build-scenes.py --check
